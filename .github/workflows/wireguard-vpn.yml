name: WireGuard VPN

on:
  push:
    branches: [main]
    paths: ['projects/wireguard-vpn/**', '.github/workflows/wireguard-vpn.yml']
  pull_request:
    paths: ['projects/wireguard-vpn/**', '.github/workflows/wireguard-vpn.yml']

permissions:
  contents: read

jobs:
  vpn:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/wireguard-vpn
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm test
      - run: sudo modprobe wireguard && sudo modprobe nf_tables
      - run: npm run test:tunnel
